[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel2script-ai"
version = "0.2.0"
description = "Convert 3+ novel chapters into structured screenplay YAML using LangChain + LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "jsonschema>=4.22.0",
  "python-dotenv>=1.0.0",
  "langchain>=0.3",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "pydantic>=2.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
novel2script = "novel2script.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
