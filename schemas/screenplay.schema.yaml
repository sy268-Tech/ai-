$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Novel Adapted Screenplay YAML Schema"
type: object
required:
  - schema_version
  - script
properties:
  schema_version:
    type: string
    enum:
      - "1.0"

  script:
    type: object
    required:
      - title
      - format
      - language
      - source
      - characters
      - locations
      - scenes
    properties:
      title:
        type: string
        minLength: 1

      format:
        type: string
        enum:
          - film
          - web_series
          - short_drama
          - animation
          - audio_drama
          - stage_play
          - unknown

      language:
        type: string
        default: "zh-CN"

      genre:
        type: array
        items:
          type: string

      logline:
        type: string

      synopsis:
        type: string

      source:
        type: object
        required:
          - novel_title
          - adapted_chapters
        properties:
          novel_title:
            type: string
            minLength: 1
          author:
            type: string
          adapted_chapters:
            type: array
            minItems: 3
            items:
              type: integer
              minimum: 1
          source_note:
            type: string
        additionalProperties: true

      metadata:
        type: object
        additionalProperties: true

      characters:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - name
            - role
            - description
          properties:
            id:
              type: string
              pattern: "^char_[a-zA-Z0-9_]+$"
            name:
              type: string
              minLength: 1
            role:
              type: string
              enum:
                - protagonist
                - antagonist
                - supporting
                - mentor
                - love_interest
                - comic_relief
                - minor
                - unknown
            age:
              type: string
            gender:
              type: string
            description:
              type: string
            goal:
              type: string
            conflict:
              type: string
            relationships:
              type: array
              items:
                type: object
                required:
                  - character_id
                  - relation
                properties:
                  character_id:
                    type: string
                  relation:
                    type: string
                additionalProperties: true
            source_chapters:
              type: array
              items:
                type: integer
          additionalProperties: true

      locations:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - name
            - description
          properties:
            id:
              type: string
              pattern: "^loc_[a-zA-Z0-9_]+$"
            name:
              type: string
              minLength: 1
            type:
              type: string
              enum:
                - interior
                - exterior
                - mixed
                - unknown
            description:
              type: string
            atmosphere:
              type: string
            source_chapters:
              type: array
              items:
                type: integer
          additionalProperties: true

      scenes:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - id
            - scene_number
            - source_chapters
            - heading
            - summary
            - beats
          properties:
            id:
              type: string
              pattern: "^scene_[0-9]{3,}$"
            scene_number:
              type: integer
              minimum: 1
            source_chapters:
              type: array
              minItems: 1
              items:
                type: integer
            heading:
              type: object
              required:
                - location_id
                - time_of_day
                - interior_exterior
              properties:
                location_id:
                  type: string
                time_of_day:
                  type: string
                  enum:
                    - morning
                    - day
                    - afternoon
                    - evening
                    - night
                    - dawn
                    - dusk
                    - continuous
                    - unknown
                interior_exterior:
                  type: string
                  enum:
                    - INT
                    - EXT
                    - INT_EXT
                    - UNKNOWN
              additionalProperties: true
            dramatic_function:
              type: string
            summary:
              type: string
              minLength: 1
            characters:
              type: array
              items:
                type: string
            beats:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - type
                  - text
                properties:
                  type:
                    type: string
                    enum:
                      - action
                      - dialogue
                      - narration
                      - sound
                      - visual
                      - pause
                      - insert
                  text:
                    type: string
                    minLength: 1
                  character_id:
                    type: string
                  parenthetical:
                    type: string
                  emotion:
                    type: string
                  camera:
                    type: string
                  source_text_ref:
                    type: string
                additionalProperties: true
            transition:
              type: string
              enum:
                - CUT_TO
                - FADE_IN
                - FADE_OUT
                - DISSOLVE_TO
                - MATCH_CUT
                - SMASH_CUT
                - CONTINUOUS
                - NONE
            notes:
              type: array
              items:
                type: string
          additionalProperties: true

      notes:
        type: array
        items:
          type: string
    additionalProperties: true
additionalProperties: true
